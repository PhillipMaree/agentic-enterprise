# agentic-platform — local dev stack.
#
# Three planes:
#   - Data:       LiteLLM proxy, MCP gateway, Presidio (PII masking)
#   - Tracking:   MLflow
#   - Telemetry:  OTel Collector → Tempo (traces), Loki (logs), Prometheus (metrics)
#                 + Grafana as unified UI
#
# Shared infra: SeaweedFS (S3), Redis, Postgres, FalkorDB.
#
# Required env (see .env.example):
#   LITELLM_MASTER_KEY, LITELLM_UI_USERNAME, LITELLM_UI_PASSWORD,
#   GRAFANA_ADMIN_PASSWORD, ANTHROPIC_API_KEY, OPENAI_API_KEY.

services:
  # =========================================================================
  # Shared infrastructure
  # =========================================================================

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    container_name: seaweedfs
    command:
      - server
      - -dir=/data
      - -s3
      # Without -s3.config, SeaweedFS rejects v4-signed requests
      # ("Signed request requires setting up SeaweedFS S3 authentication").
      # Tempo, Loki, and MLflow all sign their S3 requests, so we provide
      # a permissive dev identities file that accepts the `any:any` creds.
      - -s3.config=/etc/seaweedfs/s3-identities.json
      - -master.volumeSizeLimitMB=1024
    ports:
      - "19333:9333"
      - "19080:8080"
      - "18888:8888"
      - "18333:8333"
    volumes:
      - ./.seaweedfs:/data
      - ./config/seaweedfs/s3-identities.json:/etc/seaweedfs/s3-identities.json:ro
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 not localhost: SeaweedFS binds IPv4 only, but
      # `localhost` inside the container resolves to ::1 first → ECONNREFUSED.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - network_bridge

  redis:
    image: redis:latest
    hostname: redis
    container_name: redis-db
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - ./.redis:/data:rw
    environment:
      - REDIS_ARGS=--appendonly no --protected-mode no
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    networks:
      - network_bridge

  postgres:
    image: postgres:latest
    container_name: postgres
    hostname: postgres
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Server reads the password from a file-based secret. The DSN consumers
      # (postgres-init, litellm, mlflow) build connection strings from
      # ${POSTGRES_PASSWORD} via .env substitution — keep the two in sync.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    secrets:
      - postgres_password
    ports:
      - "15432:5432"
    volumes:
      - ./.postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - network_bridge

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    hostname: falkordb
    restart: unless-stopped
    ports:
      - "16380:6379"
      - "13000:3000"
    volumes:
      - ./.falkordb:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - network_bridge

  # =========================================================================
  # One-shot bootstraps
  # =========================================================================

  # Creates the `litellm` database in the existing Postgres. Idempotent.
  postgres-init:
    image: postgres:latest
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
    entrypoint:
      - bash
      - -c
      - |
        psql -tc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1 \
          || psql -c "CREATE DATABASE litellm"
        echo "litellm db ready"
    restart: "no"
    networks:
      - network_bridge

  # Creates SeaweedFS buckets used by tempo/loki/mlflow. Idempotent.
  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-any}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-any}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "/etc/init/buckets.sh"]
    volumes:
      - ./config/seaweedfs-init/buckets.sh:/etc/init/buckets.sh:ro
    restart: "no"
    networks:
      - network_bridge

  # =========================================================================
  # Data plane
  # =========================================================================

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: presidio-analyzer
    hostname: presidio-analyzer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network_bridge

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    hostname: presidio-anonymizer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - network_bridge

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    hostname: litellm
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "14000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      # Defaults make the stack runnable without a .env file. Override in
      # .env for anything beyond local laptop dev — the default master key
      # is hardcoded everywhere and obviously not a secret.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master-key-change-me-not-a-secret}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-password}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # PII masking — points LiteLLM's Presidio callback at the sidecars.
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      # OTLP egress to the collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: litellm
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      # litellm image has no curl/wget; use Python (which it does have).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - network_bridge

  # Obot — MCP gateway + registry + chat UI from obot-platform.
  # Replaces the earlier docker/mcp-gateway. Unlike that one, Obot is
  # k8s-native (deploys each MCP server as a workload), so the same
  # component runs in both Compose and the kind cluster.
  #
  # Host port is 8090 because SeaweedFS volume already owns 8080.
  obot:
    image: ghcr.io/obot-platform/obot:latest
    container_name: obot
    hostname: obot
    restart: unless-stopped
    ports:
      - "18090:8080"
    volumes:
      # Obot uses the docker socket to spawn MCP server containers when
      # running outside k8s. Same docker socket dance as the old gateway.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.obot:/data
    environment:
      OBOT_SERVER_AUTH_REGISTRY_REQUIRE_AUTH: "false"
      OBOT_SERVER_UPDATE_CHECK: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network_bridge

  # =========================================================================
  # Experiment tracking
  # =========================================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: mlflow
    hostname: mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "15000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-any}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-any}
      AWS_DEFAULT_REGION: us-east-1
    # The official ghcr.io/mlflow/mlflow image doesn't bundle a Postgres
    # driver. Install psycopg2-binary on startup so the Postgres backend
    # store works. (Adds ~5s to startup; pip wheel cache hides the cost
    # on subsequent restarts.)
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >
        pip install --quiet --no-cache-dir psycopg2-binary boto3 &&
        exec mlflow server
        --host=0.0.0.0
        --port=5000
        --backend-store-uri=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-mlflow}
        --artifacts-destination=s3://mlflow-artifacts
        --serve-artifacts
        --gunicorn-opts=--log-level=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network_bridge

  # =========================================================================
  # Telemetry plane
  # =========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      - "14317:4317"   # OTLP gRPC
      - "14318:4318"   # OTLP HTTP
      - "18889:8888"   # collector's own /metrics (8888 inside, 18889 on host
                      # to avoid colliding with SeaweedFS filer on 18888)
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    command: ["--config=/etc/otel-collector/config.yaml"]
    networks:
      - network_bridge

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    hostname: tempo
    restart: unless-stopped
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "13200:3200"   # query API
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./.tempo:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # No healthcheck — the grafana/tempo image is distroless (no shell,
    # no curl/wget). Dependents (otel-collector, grafana) use
    # `service_started` instead of `service_healthy`.
    networks:
      - network_bridge

  loki:
    image: grafana/loki:latest
    container_name: loki
    hostname: loki
    restart: unless-stopped
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "13100:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./.loki:/var/loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    # No healthcheck — the grafana/loki image is distroless. See tempo.
    networks:
      - network_bridge

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - network_bridge

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      # Host port 13001 because 13000 is taken by falkordb's browser UI.
      - "13001:3000"
    environment:
      # Admin password from a file-based secret (Grafana reads GF_*__FILE).
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceToMetrics"
    secrets:
      - grafana_admin_password
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - network_bridge

  # Keycloak — central IdP for agentic apps (realm agentic-dev). Dev mode (H2),
  # imports the realm on startup. Listens on 18080 (compose convention: host-
  # exposed ports are 1xxxx; 8080 is taken by seaweedfs). KC_HOSTNAME pins the
  # issuer to keycloak:18080 so the token `iss` matches for both the browser
  # (add `127.0.0.1 keycloak` to /etc/hosts, reach it at keycloak:18080) and
  # in-network validators.
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm", "--features=token-exchange"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      # Admin password from a file-based secret (Keycloak 26 reads *_FILE).
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_HOSTNAME: http://keycloak:18080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "18080"
    secrets:
      - keycloak_admin_password
    ports:
      - "18080:18080"
    volumes:
      - ./deploy/helm/keycloak/realm-agentic-dev.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/18080 && echo ok >&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - network_bridge

volumes:
  prometheus-data:
  grafana-data:

# File-based secrets. Values live in gitignored secrets/compose/<name>;
# copy the committed *.example to bootstrap (`cp secrets/compose/X.example
# secrets/compose/X`). Real values never get committed. See docs/SECURITY.md.
secrets:
  postgres_password:
    file: ./secrets/compose/postgres_password
  keycloak_admin_password:
    file: ./secrets/compose/keycloak_admin_password
  grafana_admin_password:
    file: ./secrets/compose/grafana_admin_password

networks:
  network_bridge:
    driver: bridge
