# agentic-platform — local dev stack.
#
# Three planes:
#   - Data:       LiteLLM proxy, MCP gateway, Presidio (PII masking)
#   - Tracking:   MLflow
#   - Telemetry:  OTel Collector → Tempo (traces), Loki (logs), Prometheus (metrics)
#                 + Grafana as unified UI
#
# Shared infra: SeaweedFS (S3), Redis, Postgres, FalkorDB.
#
# Required env (see .env.example):
#   LITELLM_MASTER_KEY, LITELLM_UI_USERNAME, LITELLM_UI_PASSWORD,
#   GRAFANA_ADMIN_PASSWORD, ANTHROPIC_API_KEY, OPENAI_API_KEY.

services:
  # =========================================================================
  # Shared infrastructure
  # =========================================================================

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    container_name: seaweedfs
    command:
      - server
      - -dir=/data
      - -s3
      - -master.volumeSizeLimitMB=1024
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8888:8888"
      - "8333:8333"
    volumes:
      - ./.seaweedfs:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - network_bridge

  redis:
    image: redis:latest
    hostname: redis
    container_name: redis-db
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.redis:/data:rw
    environment:
      - REDIS_ARGS=--appendonly no --protected-mode no
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    networks:
      - network_bridge

  postgres:
    image: postgres:latest
    container_name: postgres
    hostname: postgres
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - network_bridge

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    hostname: falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
      - "3000:3000"
    volumes:
      - ./.falkordb:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - network_bridge

  # =========================================================================
  # One-shot bootstraps
  # =========================================================================

  # Creates the `litellm` database in the existing Postgres. Idempotent.
  postgres-init:
    image: postgres:latest
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: password
    entrypoint:
      - bash
      - -c
      - |
        psql -tc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1 \
          || psql -c "CREATE DATABASE litellm"
        echo "litellm db ready"
    restart: "no"
    networks:
      - network_bridge

  # Creates SeaweedFS buckets used by tempo/loki/mlflow. Idempotent.
  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/init/buckets.sh"]
    volumes:
      - ./config/seaweedfs-init/buckets.sh:/etc/init/buckets.sh:ro
    restart: "no"
    networks:
      - network_bridge

  # =========================================================================
  # Data plane
  # =========================================================================

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: presidio-analyzer
    hostname: presidio-analyzer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network_bridge

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    hostname: presidio-anonymizer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - network_bridge

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    hostname: litellm
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # PII masking — points LiteLLM's Presidio callback at the sidecars.
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      # OTLP egress to the collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: litellm
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - network_bridge

  mcp-gateway:
    image: docker/mcp-gateway:latest
    container_name: mcp-gateway
    hostname: mcp-gateway
    restart: unless-stopped
    ports:
      - "8811:8811"
    volumes:
      - ./config/mcp-gateway/config.yaml:/etc/mcp-gateway/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8811/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - network_bridge

  # =========================================================================
  # Experiment tracking
  # =========================================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: mlflow
    hostname: mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: any
      AWS_SECRET_ACCESS_KEY: any
      AWS_DEFAULT_REGION: us-east-1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://postgres:password@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow-artifacts
      - --serve-artifacts
      - --gunicorn-opts=--log-level=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network_bridge

  # =========================================================================
  # Telemetry plane
  # =========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    command: ["--config=/etc/otel-collector/config.yaml"]
    networks:
      - network_bridge

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    hostname: tempo
    restart: unless-stopped
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "3200:3200"   # query API
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./.tempo:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network_bridge

  loki:
    image: grafana/loki:latest
    container_name: loki
    hostname: loki
    restart: unless-stopped
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./.loki:/var/loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network_bridge

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - network_bridge

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      # Host port 3001 because 3000 is taken by falkordb's browser UI.
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceToMetrics"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - network_bridge

volumes:
  prometheus-data:
  grafana-data:

networks:
  network_bridge:
    driver: bridge
