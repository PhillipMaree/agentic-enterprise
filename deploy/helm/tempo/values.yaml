# Overrides for grafana/tempo (single-binary; NOT tempo-distributed),
# installed directly via `--repo`. Mirrors config/tempo/tempo.yaml.
#
# Storage backend is the SeaweedFS S3 deployed by agentic-enterprise-seaweedfs.
# Bucket `tempo-traces` must exist before this chart starts —
# deploy.sh runs the bootstrap-buckets Job as a pre-install hook.

# Inline tempo config. The chart wraps this in a ConfigMap and mounts it.
# S3 credentials are injected as AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from
# the agentic-enterprise-s3-creds Secret (decrypted from
# deploy/sealed-secrets/s3.sealed.yaml). access_key/secret_key are omitted
# below so Tempo's S3 client falls back to the AWS credential chain (env).
tempo:
  extraEnvFrom:
    - secretRef:
        name: agentic-enterprise-s3-creds
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-traces
        endpoint: agentic-enterprise-seaweedfs-all-in-one:8333
        insecure: true
        forcepathstyle: true
      wal:
        path: /var/tempo/wal

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  ingester:
    trace_idle_period: 10s
    max_block_bytes: 1_000_000
    max_block_duration: 5m

  compactor:
    compaction:
      block_retention: 24h

persistence:
  enabled: true
  size: 1Gi

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
