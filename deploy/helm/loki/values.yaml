# Overrides for grafana/loki (single-binary mode), installed directly
# via `--repo`. Mirrors config/loki/loki-config.yaml.
#
# Storage backend: SeaweedFS S3 (loki-logs bucket). Bucket is created by
# the bootstrap-buckets Job that deploy.sh runs before this install.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-logs
      ruler: loki-logs
      admin: loki-logs
    s3:
      endpoint: agentic-enterprise-seaweedfs-all-in-one:8333
      # accessKeyId/secretAccessKey omitted — injected as
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from agentic-enterprise-s3-creds via
      # singleBinary.extraEnvFrom (see below); Loki's S3 client uses the AWS
      # credential chain (env) when static keys are absent.
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    retention_period: 72h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_structured_metadata: true
  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: s3
    retention_enabled: true

singleBinary:
  replicas: 1
  # Inject S3 credentials (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) from the
  # agentic-enterprise-s3-creds Secret, decrypted from deploy/sealed-secrets/s3.sealed.yaml.
  extraEnvFrom:
    - secretRef:
        name: agentic-enterprise-s3-creds
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Disable cluster components we don't need in single-binary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Caches are overkill for dev; disable to keep the pod count down.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

gateway:
  enabled: false
