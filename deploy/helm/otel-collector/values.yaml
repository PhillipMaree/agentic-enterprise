# Overrides for the upstream open-telemetry/opentelemetry-collector chart,
# installed directly via `--repo`. Keep in sync with
# config/otel-collector/config.yaml (Compose reads from there; Helm reads
# from here).
#
# Logs path uses otlphttp → Loki's native OTLP endpoint. The dedicated
# `loki` exporter was removed from otel-collector-contrib.

# The contrib distribution includes the prometheusremotewrite exporter
# (the core distribution does not). loki is no longer needed; we send
# logs via otlphttp instead.
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib

replicaCount: 1

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

# Mirrors config/otel-collector/config.yaml. See comments there for why
# each block exists; here we only declare values.
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
      spike_limit_mib: 128
    batch:
      timeout: 10s
      send_batch_size: 1024

  exporters:
    otlp/tempo:
      endpoint: platform-tempo:4317
      tls:
        insecure: true
    prometheusremotewrite:
      endpoint: http://platform-prometheus-server/api/v1/write
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://platform-loki:3100/otlp
      tls:
        insecure: true

  service:
    # Self-metrics already configured by the chart on :8888 (see
    # ports.metrics above); don't add a duplicate `telemetry.metrics`
    # listener — they fight for the same bind.
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
