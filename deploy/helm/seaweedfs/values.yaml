seaweedfs:
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false
  s3:
    enabled: false

  allInOne:
    enabled: true
    replicas: 1
    s3:
      enabled: true
      # S3 auth on. Credentials (the seaweedfs_s3_config JSON) come from the
      # platform-s3-creds Secret, decrypted from
      # deploy/sealed-secrets/s3.sealed.yaml. The chart mounts that Secret and
      # passes -s3.config=<mount>/seaweedfs_s3_config to the gateway.
      enableAuth: true
      existingConfigSecret: platform-s3-creds
    data:
      type: persistentVolumeClaim
      size: 2Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
