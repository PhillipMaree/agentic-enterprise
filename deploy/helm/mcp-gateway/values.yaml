# Hand-written chart for Docker's MCP Gateway. No upstream Helm chart at
# time of writing. Single-replica stateless deployment.

image:
  repository: docker/mcp-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8811

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The MCP gateway config — see https://github.com/docker/mcp-gateway.
# Mirrors config/mcp-gateway/config.yaml. Add MCP servers here.
config:
  servers: {}
