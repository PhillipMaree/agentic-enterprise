# Overrides for prometheus-community/prometheus.
# Mirrors config/prometheus/prometheus.yml.
#
# Two ingest paths: pull (scrape) + push (remote-write receiver).
# The OTel Collector remote-writes metrics here.

prometheus:
  server:
    # --web.enable-remote-write-receiver is what makes the OTel Collector's
    # `prometheusremotewrite` exporter work. Without this flag the receiver
    # is disabled and OTLP metrics are silently dropped.
    extraFlags:
      - web.enable-remote-write-receiver
      - web.enable-lifecycle
    persistentVolume:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    service:
      type: ClusterIP

  # Skip the bundled kube-state-metrics + node-exporter etc. — for dev/kind
  # they add a lot of pods to no benefit. Add back in real clusters.
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

  serverFiles:
    prometheus.yml:
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: otel-collector
          static_configs:
            - targets: ["platform-otel-collector:8888"]
        - job_name: litellm
          metrics_path: /metrics
          static_configs:
            - targets: ["platform-litellm:4000"]
        - job_name: mlflow
          metrics_path: /metrics
          static_configs:
            - targets: ["platform-mlflow:5000"]
