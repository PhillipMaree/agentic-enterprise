# Overrides for prometheus-community/prometheus, installed directly via
# `--repo` (not as a Helm umbrella subchart). Mirrors
# config/prometheus/prometheus.yml.
#
# Two ingest paths: pull (scrape) + push (remote-write receiver).
# The OTel Collector remote-writes metrics here.

server:
  # --web.enable-remote-write-receiver is what makes the OTel Collector's
  # `prometheusremotewrite` exporter work. Without this flag the receiver
  # is disabled and OTLP metrics are silently dropped.
  extraFlags:
    - web.enable-remote-write-receiver
    - web.enable-lifecycle
  persistentVolume:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  service:
    type: ClusterIP
  # Tighten the default 1m scrape interval — dev runs are short and we
  # want quick feedback. (Override at this level instead of in
  # serverFiles.prometheus.yml.global, which the chart concatenates with
  # its own `global:` block and produces invalid YAML.)
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

# Skip the bundled kube-state-metrics + node-exporter etc. — for dev/kind
# they add a lot of pods to no benefit. Add back in real clusters.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

# extraScrapeConfigs are appended to the chart's default `prometheus.yml`,
# avoiding the duplicate-`global:` bug we hit when overriding
# `serverFiles.prometheus.yml` directly.
extraScrapeConfigs: |
  - job_name: otel-collector
    static_configs:
      - targets: ["enterprise-platform-otel-collector:8888"]
  - job_name: litellm
    # Trailing slash: LiteLLM redirects /metrics → /metrics/ (307),
    # Prometheus doesn't follow scrape redirects.
    metrics_path: /metrics/
    static_configs:
      - targets: ["enterprise-platform-litellm:4000"]
