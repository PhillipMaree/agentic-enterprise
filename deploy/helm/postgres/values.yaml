image:
  repository: postgres
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 5432

# NOTE: these no longer seed a Secret — the enterprise-platform-postgres Secret is
# decrypted from deploy/sealed-secrets/postgres.sealed.yaml (keys
# POSTGRES_USER/PASSWORD/DB). `username` is kept only for the readiness
# probe's `pg_isready -U <user>` and must match the sealed POSTGRES_USER.
auth:
  username: postgres

persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
