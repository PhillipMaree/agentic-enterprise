apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-analyzer
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-analyzer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-analyzer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-analyzer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: analyzer
    spec:
      containers:
        - name: analyzer
          image: "{{ .Values.analyzer.image.repository }}:{{ .Values.analyzer.image.tag }}"
          imagePullPolicy: {{ .Values.analyzer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.analyzer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-analyzer
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-analyzer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analyzer
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-analyzer
    app.kubernetes.io/instance: {{ .Release.Name }}
