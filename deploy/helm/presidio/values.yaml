# Hand-written chart — no widely-maintained upstream Helm chart for the
# Presidio analyzer/anonymizer pair. Both are stateless HTTP services
# running on container port 3000.

analyzer:
  image:
    repository: mcr.microsoft.com/presidio-analyzer
    # Pin a real version — MCR has no `latest` tag for presidio (HEAD on
    # :latest returns 403), which flaked the litellm CI job on ImagePullBackOff.
    tag: "2.2.361"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

anonymizer:
  image:
    repository: mcr.microsoft.com/presidio-anonymizer
    tag: "2.2.361"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
