# DEV-ONLY Sealed Secrets sealing keypair (controller private key).
#
# !!! This private key is PUBLIC by virtue of being committed. Anyone with
# this repo can decrypt every committed dev SealedSecret. It exists ONLY so
# deploy.sh and CI reproduce the same controller key in every fresh kind
# cluster. NEVER reuse for prod — prod owns its own key (secrets/prod holds
# only the public cert). See docs/SECURITY.md.
apiVersion: v1
kind: Secret
metadata:
  name: sealed-secrets-dev-key
  namespace: kube-system
  labels:
    sealedsecrets.bitnami.com/sealed-secrets-key: active
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
