# Docker MCP Gateway — federates multiple MCP servers behind a single
# endpoint so clients (Claude Desktop, IDE plugins, agentic apps) connect
# once and see the union of all configured servers' tools.
#
# See: https://github.com/docker/mcp-gateway
#
# Empty by default. Add MCP servers as needed. Example shape:
#
#   servers:
#     filesystem:
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
#     github:
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-github"]
#       env:
#         GITHUB_TOKEN: ${GITHUB_TOKEN}

servers: {}
