# Grafana datasource provisioning.
#
# Why provisioning (vs. UI-clicked datasources):
#   - Reproducible: blow away the grafana-data volume, datasources reappear.
#   - Version-controlled: review in PRs like any other code.
#
# Three datasources, all internal cluster URLs. Tempo→Loki and Tempo→Metrics
# correlations are pre-wired so you can jump from a trace span straight to
# the matching log line or RED metric.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Pull trace ID out of log lines and turn into a Tempo link.
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Trace → Logs: search Loki for the span's trace ID.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
      # Trace → Metrics: query Prometheus for service-level RED metrics.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
