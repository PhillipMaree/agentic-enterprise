# Prometheus — metrics storage + scraper.
#
# Two ingest paths:
#   1. Pull (scrape):     prometheus polls /metrics endpoints listed below.
#   2. Push (remote-write): the OTel Collector remote-writes here.
#                          Enabled via --web.enable-remote-write-receiver
#                          in docker-compose.yaml command flags.
#
# Storage: local TSDB at /prometheus. For long-term, S3-backed storage you'd
# add Thanos sidecar or Grafana Mimir — out of scope for this dev stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus' own metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OTel Collector internal telemetry. The collector emits its own metrics
  # on :8888 (configured in config/otel-collector/config.yaml).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # LiteLLM exposes Prometheus metrics on /metrics. The endpoint is made
  # public via `require_auth_for_metrics_endpoint: false` in litellm's
  # config, so no auth header is needed here.
  - job_name: litellm
    # Trailing slash: LiteLLM redirects /metrics → /metrics/ (307) and
    # Prometheus does not follow redirects on scrapes.
    metrics_path: /metrics/
    static_configs:
      - targets: ["litellm:4000"]

  # NOTE: MLflow does NOT expose /metrics in the default ghcr.io/mlflow/mlflow
  # image — it needs `prometheus_flask_exporter` installed and enabled at
  # startup. Removed to avoid noise from a permanently-down scrape target.
  # If you want MLflow metrics, install the exporter and add the scrape
  # config back here.
