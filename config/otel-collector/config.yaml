# OpenTelemetry Collector — central telemetry fan-out for agentic-enterprise.
#
# Why a collector at all:
#   Apps emit OTLP once. The collector handles routing per signal type to the
#   appropriate backend (traces→tempo, metrics→prometheus, logs→loki). Apps
#   don't need backend-specific SDKs and we can swap backends without touching
#   application code.
#
# Pipelines (one per signal):
#   traces:  OTLP in → batch → Tempo  (via OTLP gRPC)
#   metrics: OTLP in → batch → Prometheus  (via remote-write)
#   logs:    OTLP in → batch → Loki  (via OTLP HTTP — Loki 3.0+ native)
#
# Why otlphttp for logs:
#   The dedicated `loki` exporter was removed from otel-collector-contrib.
#   Loki 3.0+ natively accepts OTLP HTTP at /otlp/v1/logs, so we use the
#   generic `otlphttp` exporter pointed at that path.

receivers:
  # OTLP is the only ingress. Both gRPC (4317) and HTTP (4318) are exposed
  # so SDKs in any language can push.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter MUST come first in every pipeline — it drops data under
  # pressure to keep the collector itself alive (otherwise it OOMs and you
  # lose everything in flight).
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Batching dramatically reduces backend write amplification. Tune
  # timeout/size if you're seeing visible latency in Grafana.
  batch:
    timeout: 10s
    send_batch_size: 1024

connectors:
  # Derive RED metrics (request count, errors, latency histogram) from spans so
  # MCP/Obot tool calls show up as usage metrics in Prometheus — there is no
  # native per-tool metric otherwise. `tenant` is read from a span attribute
  # (the MCP client sets it, e.g. from the Keycloak `tenant` claim) so the
  # Grafana dashboard can partition by tenant. Emits `calls_total` and
  # `duration_milliseconds_*` labelled service_name/span_name/status_code/tenant.
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    dimensions:
      - name: tenant
        default: unknown
    metrics_flush_interval: 15s

exporters:
  # Traces → Tempo. Use OTLP gRPC; Tempo speaks OTLP natively on 4317.
  # `insecure: true` because we're inside the compose network — no TLS.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics → Prometheus via remote-write. Requires
  # `--web.enable-remote-write-receiver` on the Prometheus side (set in
  # docker-compose.yaml).
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

  # Logs → Loki via Loki's native OTLP HTTP endpoint.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  # Expose the collector's own metrics on :8888 so Prometheus can scrape them.
  # The new schema (v0.111+) uses a `readers` array — the older
  # `metrics.address` field was removed.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # Fan traces to Tempo AND the spanmetrics connector (which feeds the
      # metrics/spanmetrics pipeline below).
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    # Span-derived RED metrics → Prometheus (separate pipeline so it doesn't
    # re-batch the raw OTLP metrics path).
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
