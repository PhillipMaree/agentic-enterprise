# Grafana Tempo — distributed tracing backend, monolithic (single-binary) mode.
#
# Storage: S3 (SeaweedFS) bucket `tempo-traces`. Bucket is created by the
# `seaweedfs-init` service before Tempo starts.
#
# Kept deliberately minimal — recent Tempo versions are strict about
# unknown fields, so we set only what's required and let everything else
# default. Defaults are fine for dev (24h retention, 5min block duration).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: seaweedfs:8333
      # SeaweedFS S3 auth is disabled in this stack (dev only). Any
      # non-empty credentials are accepted.
      access_key: any
      secret_key: any
      insecure: true
      forcepathstyle: true
    wal:
      # Local on-disk WAL — flushed to S3 by the ingester.
      path: /var/tempo/wal
