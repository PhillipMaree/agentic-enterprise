name: deploy-prometheus
run-name: deploy-prometheus

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/prometheus/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-prometheus.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-prometheus.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/prometheus/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-prometheus.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-prometheus.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: prometheus
      smoke_script: smoke-prometheus.sh
