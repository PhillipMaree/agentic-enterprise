name: deploy-prometheus

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/prometheus/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-prometheus.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/prometheus/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-prometheus.yaml"

permissions:
  contents: read

jobs:
  deploy:
    name: helm install on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
      RELEASE: platform-prometheus
      CHART_DIR: deploy/helm/prometheus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm dependency update
        run: helm dependency update "$CHART_DIR"

      - name: helm lint
        run: helm lint "$CHART_DIR"

      - name: helm template (render only)
        run: helm template "$RELEASE" "$CHART_DIR" --namespace "$NAMESPACE"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: helm install
        run: |
          helm install "$RELEASE" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            --wait --timeout 8m

      - name: Wait for workloads
        run: |
          kubectl -n "$NAMESPACE" wait \
            --for=condition=Available deployment --all \
            --timeout=300s
          kubectl -n "$NAMESPACE" get pods,svc

      - name: Integration test — Prometheus ready + self-scrape
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/${RELEASE}-server 9090:80 >/tmp/pf.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1 && break
            sleep 1
          done

          # Prometheus should scrape itself; the `up` metric for job=prometheus
          # should appear with value 1.
          for i in $(seq 1 30); do
            RESP="$(curl -fsS 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22prometheus%22%7D')"
            echo "$RESP"
            VAL="$(echo "$RESP" | grep -oE '"value":\[[0-9.]+,"[01]"' | tail -1)"
            echo "$VAL" | grep -q '"1"' && exit 0
            sleep 2
          done
          echo "prometheus did not self-scrape successfully"
          exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance="$RELEASE" --all-containers --tail=200 || true
