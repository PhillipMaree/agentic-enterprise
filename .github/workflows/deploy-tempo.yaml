name: deploy-tempo
run-name: deploy-tempo

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/tempo/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-tempo.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-tempo.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/tempo/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-tempo.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-tempo.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: tempo
      smoke_script: smoke-tempo.sh
