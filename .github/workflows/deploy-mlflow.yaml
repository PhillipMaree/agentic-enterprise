name: deploy-mlflow
run-name: deploy-mlflow

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/mlflow/**"
      - "deploy/helm/postgres/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-mlflow.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-mlflow.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/mlflow/**"
      - "deploy/helm/postgres/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-mlflow.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-mlflow.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: mlflow
      smoke_script: smoke-mlflow.sh
