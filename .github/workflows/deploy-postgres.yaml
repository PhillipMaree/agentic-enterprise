name: deploy-postgres

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/postgres/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-postgres.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/postgres/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-postgres.yaml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: deploy.sh --up postgres on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
      RELEASE: platform-postgres
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Install via deploy.sh
        run: ./deploy.sh --up postgres

      - name: Smoke test pg_isready + SELECT 1
        run: |
          set -euo pipefail
          POD="$(kubectl -n "$NAMESPACE" get pod -l app.kubernetes.io/instance="$RELEASE" -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "$NAMESPACE" exec "$POD" -- pg_isready -U postgres
          kubectl -n "$NAMESPACE" exec "$POD" -- psql -U postgres -d mlflow -c 'SELECT 1 AS up;'

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance="$RELEASE" --all-containers --tail=200 || true
