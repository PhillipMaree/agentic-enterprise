name: deploy-otel-collector
run-name: deploy-otel-collector

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/otel-collector/**"
      - "deploy/helm/tempo/**"
      - "deploy/helm/loki/**"
      - "deploy/helm/prometheus/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-otel-collector.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-otel-collector.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/otel-collector/**"
      - "deploy/helm/tempo/**"
      - "deploy/helm/loki/**"
      - "deploy/helm/prometheus/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-otel-collector.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-otel-collector.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

# This one needs the backends installed too, so smoke-otel-collector.sh
# expects platform-tempo / loki / prometheus services to exist. The
# reusable workflow installs only the named chart; we trigger the
# dependents in a preceding job.

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: otel-collector
      smoke_script: smoke-otel-collector.sh
