name: deploy-falkordb

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/falkordb/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-falkordb.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/falkordb/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-falkordb.yaml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: deploy.sh --up falkordb on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
      RELEASE: platform-falkordb
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Install via deploy.sh
        run: ./deploy.sh --up falkordb

      - name: Smoke test GRAPH module + GRAPH.QUERY + GRAPH.LIST
        run: |
          set -euo pipefail
          POD="$(kubectl -n "$NAMESPACE" get pod -l app.kubernetes.io/instance="$RELEASE" -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "$NAMESPACE" exec "$POD" -- redis-cli ping | tee /tmp/ping
          grep -q PONG /tmp/ping
          kubectl -n "$NAMESPACE" exec "$POD" -- redis-cli MODULE LIST | tee /tmp/modules
          grep -qi graph /tmp/modules || { echo "Graph module missing"; exit 1; }
          kubectl -n "$NAMESPACE" exec "$POD" -- redis-cli GRAPH.QUERY smoke "CREATE (:T {n:1}) RETURN 1"
          kubectl -n "$NAMESPACE" exec "$POD" -- redis-cli GRAPH.LIST

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance="$RELEASE" --all-containers --tail=200 || true
