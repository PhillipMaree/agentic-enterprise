name: deploy-falkordb
run-name: deploy-falkordb

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/falkordb/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-falkordb.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-falkordb.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/falkordb/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-falkordb.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-falkordb.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: falkordb
      smoke_script: smoke-falkordb.sh
