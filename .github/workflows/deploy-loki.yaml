name: deploy-loki

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/loki/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-loki.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/loki/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-loki.yaml"

permissions:
  contents: read

jobs:
  deploy:
    name: helm install on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm dependency update (seaweedfs + loki)
        run: |
          helm dependency update deploy/helm/seaweedfs
          helm dependency update deploy/helm/loki

      - name: helm lint
        run: |
          helm lint deploy/helm/seaweedfs
          helm lint deploy/helm/loki

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install platform-seaweedfs (dependency)
        run: |
          helm install platform-seaweedfs deploy/helm/seaweedfs \
            --namespace "$NAMESPACE" \
            --wait --timeout 5m

      - name: Bootstrap loki-logs bucket
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/platform-seaweedfs-all-in-one 8333:8333 >/tmp/pf-s3.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8333/ >/dev/null 2>&1 && break
            sleep 1
          done
          pip install --quiet awscli
          AWS_ACCESS_KEY_ID=any AWS_SECRET_ACCESS_KEY=any AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:8333 s3 mb s3://loki-logs

      - name: Install platform-loki
        run: |
          helm install platform-loki deploy/helm/loki \
            --namespace "$NAMESPACE" \
            --wait --timeout 8m

      - name: Wait for Loki workloads
        run: |
          kubectl -n "$NAMESPACE" rollout status statefulset/platform-loki --timeout=300s || true
          kubectl -n "$NAMESPACE" get pods,svc

      - name: Integration test — push a log and query it back
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/platform-loki 3100:3100 >/tmp/pf-l.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3100/ready >/dev/null 2>&1 && break
            sleep 1
          done

          NS_NANO=$(($(date +%s) * 1000000000))
          curl -fsS -X POST http://localhost:3100/loki/api/v1/push \
            -H 'Content-Type: application/json' \
            -d "{\"streams\":[{\"stream\":{\"app\":\"ci-probe\"},\"values\":[[\"${NS_NANO}\",\"hello from ci\"]]}]}"

          # Query the stream back. Allow a few seconds for ingestion.
          for i in $(seq 1 30); do
            RESP="$(curl -fsS --get \
              --data-urlencode 'query={app="ci-probe"}' \
              --data-urlencode 'start='"$((NS_NANO - 60000000000))" \
              --data-urlencode 'end='"$((NS_NANO + 60000000000))" \
              http://localhost:3100/loki/api/v1/query_range)"
            echo "$RESP" | grep -q 'hello from ci' && exit 0
            sleep 2
          done
          echo "log never appeared in Loki"
          echo "$RESP" || true
          exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance=platform-loki --all-containers --tail=200 || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance=platform-seaweedfs --all-containers --tail=200 || true
