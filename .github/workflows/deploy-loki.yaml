name: deploy-loki
run-name: deploy-loki

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/loki/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-loki.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-loki.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/loki/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-loki.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-loki.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: loki
      smoke_script: smoke-loki.sh
