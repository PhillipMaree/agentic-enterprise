name: deploy-loki

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/loki/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-loki.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/loki/**"
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-loki.yaml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: deploy.sh --up loki on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
      RELEASE: platform-loki
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Install via deploy.sh (auto-installs seaweedfs + buckets)
        run: ./deploy.sh --up loki

      - name: Smoke test push log + query back
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/${RELEASE} 3100:3100 >/tmp/pf.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3100/ready >/dev/null 2>&1 && break
            sleep 1
          done

          NS_NANO=$(($(date +%s) * 1000000000))
          curl -fsS -X POST http://localhost:3100/loki/api/v1/push \
            -H 'Content-Type: application/json' \
            -d "{\"streams\":[{\"stream\":{\"app\":\"ci-probe\"},\"values\":[[\"${NS_NANO}\",\"hello from ci\"]]}]}"

          for i in $(seq 1 30); do
            RESP="$(curl -fsS --get \
              --data-urlencode 'query={app="ci-probe"}' \
              --data-urlencode "start=$((NS_NANO - 60000000000))" \
              --data-urlencode "end=$((NS_NANO + 60000000000))" \
              http://localhost:3100/loki/api/v1/query_range)"
            echo "$RESP" | grep -q 'hello from ci' && exit 0
            sleep 2
          done
          echo "log never appeared in Loki"
          exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          for c in loki seaweedfs; do
            kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance=platform-$c --all-containers --tail=200 || true
          done
