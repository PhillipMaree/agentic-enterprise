name: deploy-obot
run-name: deploy-obot

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/obot/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-obot.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-obot.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/obot/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-obot.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-obot.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: obot
      smoke_script: smoke-obot.sh
