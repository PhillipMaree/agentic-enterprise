name: deploy-grafana
run-name: deploy-grafana

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/grafana/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-grafana.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-grafana.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/grafana/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-grafana.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-grafana.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: grafana
      smoke_script: smoke-grafana.sh
