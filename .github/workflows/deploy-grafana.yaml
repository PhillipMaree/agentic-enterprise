name: deploy-grafana

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/grafana/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-grafana.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/grafana/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-grafana.yaml"

permissions:
  contents: read

jobs:
  deploy:
    name: helm install on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
      RELEASE: platform-grafana
      CHART_DIR: deploy/helm/grafana
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm dependency update
        run: helm dependency update "$CHART_DIR"

      - name: helm lint
        run: helm lint "$CHART_DIR"

      - name: helm template (render only)
        run: helm template "$RELEASE" "$CHART_DIR" --namespace "$NAMESPACE"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: helm install
        run: |
          helm install "$RELEASE" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            --wait --timeout 8m

      - name: Wait for workloads
        run: |
          kubectl -n "$NAMESPACE" wait \
            --for=condition=Available deployment --all \
            --timeout=300s
          kubectl -n "$NAMESPACE" get pods,svc

      - name: Integration test — Grafana ready + datasources provisioned
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/${RELEASE} 3000:80 >/tmp/pf.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health | tee /tmp/health.json
          grep -q '"database":"ok"' /tmp/health.json

          # The three datasources should be present (even though backends
          # aren't installed in this workflow — Grafana provisions the
          # config-level datasource entries regardless).
          curl -fsS -u admin:change-me http://localhost:3000/api/datasources | tee /tmp/ds.json
          grep -q '"name":"Prometheus"' /tmp/ds.json
          grep -q '"name":"Loki"'       /tmp/ds.json
          grep -q '"name":"Tempo"'      /tmp/ds.json

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance="$RELEASE" --all-containers --tail=200 || true
