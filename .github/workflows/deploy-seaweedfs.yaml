name: deploy-seaweedfs

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-seaweedfs.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-seaweedfs.yaml"

permissions:
  contents: read

# Force Node 24 for actions still shipping Node-20 runtime (silences the
# deprecation warning until they cut new releases).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: deploy.sh --up seaweedfs on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Install via deploy.sh
        run: ./deploy.sh --up seaweedfs

      - name: Smoke test S3 endpoint
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/platform-seaweedfs-all-in-one 8333:8333 >/tmp/pf.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)"
            case "$CODE" in 2??|3??|4??) echo "S3 responding HTTP $CODE"; exit 0;; esac
            sleep 1
          done
          echo "S3 endpoint never responded"
          cat /tmp/pf.log || true
          exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance=platform-seaweedfs --all-containers --tail=200 || true
