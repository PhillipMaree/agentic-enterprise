name: deploy-seaweedfs
run-name: deploy-seaweedfs

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-seaweedfs.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-seaweedfs.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/seaweedfs/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-seaweedfs.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-seaweedfs.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: seaweedfs
      smoke_script: smoke-seaweedfs.sh
