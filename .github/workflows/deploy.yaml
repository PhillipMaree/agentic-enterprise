name: deploy
run-name: deploy ${{ github.ref_name }} · @${{ github.actor }}
# run-name overrides GitHub's default run title (the commit subject). Use only
# single-line fields — `github.event.head_commit.message` would dump the full
# multi-line commit body into the title.

# One workflow, many jobs. Jobs run in dependency order; downstream
# jobs are skipped if any of their `needs:` failed (i.e. seaweedfs
# failing means tempo/loki/mlflow/e2e all skip).
#
# Click into the run → see all jobs as a graph. Skipped jobs (path-
# filter mismatched or dep failed) show greyed out.
#
# Triggered on push to ANY branch (not pull_request): push events carry
# the head commit message for the run-name, and their check runs attach to
# the commit SHA — so they still surface on the PR and gate branch
# protection. No trigger-level `paths:` filter, so the `gate` job always
# reports; per-chart `changes` still decides what actually deploys.

on:
  # Validate on every branch EXCEPT main. main is validated on the PR (the
  # required `gate` check), so merging shouldn't re-run the whole build-all —
  # the prod-deploy workflow fires straight off the push to main instead.
  push:
    branches-ignore: [main]

permissions:
  contents: read
  actions: write   # cancel-on-failure: the first failing job aborts the run

# Supersede in-flight runs for the same ref: a new push cancels the
# previous run instead of stacking them.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- Detect which charts changed --------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Build every service on every push (paths-filter disabled): all outputs
      # are forced 'true' so each service job in every layer always runs and the
      # full layered flow is visible. The paths-filter step below still runs but
      # its result is intentionally unused.
      seaweedfs:       'true'
      redis:           'true'
      postgres:        'true'
      falkordb:        'true'
      keycloak:        'true'
      presidio:        'true'
      obot:            'true'
      prometheus:      'true'
      grafana:         'true'
      tempo:           'true'
      loki:            'true'
      otel-collector:  'true'
      mlflow:          'true'
      litellm:         'true'
      sealed-secrets:  'true'
      e2e:             'true'
    steps:
      - uses: actions/checkout@v5
      # Fail the run (and thus the `gate`) if any raw secret material was
      # committed under deploy/sealed-secrets/ — only kind: SealedSecret allowed.
      - name: No raw secrets committed
        run: bash scripts/check-no-raw-secrets.sh
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sealed-secrets:
              - 'deploy/helm/sealed-secrets/**'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-sealed-secrets.sh'
              - '.github/scripts/_common.sh'
            seaweedfs:
              - 'deploy/helm/seaweedfs/**'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-seaweedfs.sh'
              - '.github/scripts/_common.sh'
            redis:
              - 'deploy/helm/redis/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-redis.sh'
            postgres:
              - 'deploy/helm/postgres/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - '.github/scripts/smoke-postgres.sh'
            falkordb:
              - 'deploy/helm/falkordb/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-falkordb.sh'
            keycloak:
              - 'deploy/helm/keycloak/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - '.github/scripts/smoke-keycloak.sh'
              - '.github/scripts/_common.sh'
            presidio:
              - 'deploy/helm/presidio/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-presidio.sh'
              - '.github/scripts/_common.sh'
            obot:
              - 'deploy/helm/obot/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-obot.sh'
              - '.github/scripts/_common.sh'
            prometheus:
              - 'deploy/helm/prometheus/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-prometheus.sh'
              - '.github/scripts/_common.sh'
            grafana:
              - 'deploy/helm/grafana/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - '.github/scripts/smoke-grafana.sh'
              - '.github/scripts/_common.sh'
            tempo:
              - 'deploy/helm/tempo/**'
              - 'deploy/helm/seaweedfs/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - '.github/scripts/smoke-tempo.sh'
              - '.github/scripts/_common.sh'
            loki:
              - 'deploy/helm/loki/**'
              - 'deploy/helm/seaweedfs/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - '.github/scripts/smoke-loki.sh'
              - '.github/scripts/_common.sh'
            otel-collector:
              - 'deploy/helm/otel-collector/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - '.github/scripts/smoke-otel-collector.sh'
              - '.github/scripts/_common.sh'
            mlflow:
              - 'deploy/helm/mlflow/**'
              - 'deploy/helm/postgres/**'
              - 'deploy/helm/seaweedfs/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - '.github/scripts/smoke-mlflow.sh'
              - '.github/scripts/_common.sh'
            litellm:
              - 'deploy/helm/litellm/**'
              - 'deploy/helm/postgres/**'
              - 'deploy/helm/redis/**'
              - 'deploy/helm/presidio/**'
              - 'deploy/helm/otel-collector/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/workflows/_deploy-chart.yaml'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - '.github/scripts/smoke-litellm.sh'
              - '.github/scripts/_common.sh'
            e2e:
              - 'deploy/helm/**'
              - 'deploy/sealed-secrets/**'
              - 'secrets/dev/**'
              - 'deploy/kind/kind-config.yaml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yaml'
              - '.github/scripts/smoke-stack-e2e.sh'
              - '.github/scripts/_common.sh'

  # ----- Layer 0: infra + hand-written charts (no chart deps) -------------
  # These run in parallel. Each gated by its own paths-filter.

  # Sealed Secrets controller. deploy.sh installs it (into kube-system) as the
  # first step of every --up, so each chart job below already exercises it;
  # this job verifies it in isolation.
  sealed-secrets:
    needs: changes
    if: needs.changes.outputs.sealed-secrets == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: sealed-secrets, smoke_script: smoke-sealed-secrets.sh }

  seaweedfs:
    needs: changes
    if: needs.changes.outputs.seaweedfs == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: seaweedfs, smoke_script: smoke-seaweedfs.sh }

  redis:
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: redis, smoke_script: smoke-redis.sh }

  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: postgres, smoke_script: smoke-postgres.sh }

  falkordb:
    needs: changes
    if: needs.changes.outputs.falkordb == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: falkordb, smoke_script: smoke-falkordb.sh }

  keycloak:
    needs: changes
    if: needs.changes.outputs.keycloak == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: keycloak, smoke_script: smoke-keycloak.sh }

  presidio:
    needs: changes
    if: needs.changes.outputs.presidio == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: presidio, smoke_script: smoke-presidio.sh }

  obot:
    needs: changes
    if: needs.changes.outputs.obot == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: obot, smoke_script: smoke-obot.sh }

  prometheus:
    needs: changes
    if: needs.changes.outputs.prometheus == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: prometheus, smoke_script: smoke-prometheus.sh }

  grafana:
    needs: changes
    if: needs.changes.outputs.grafana == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: grafana, smoke_script: smoke-grafana.sh }

  otel-collector:
    needs: changes
    if: needs.changes.outputs.otel-collector == 'true'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: otel-collector, smoke_script: smoke-otel-collector.sh }

  # ----- Layer 1: need seaweedfs ------------------------------------------

  tempo:
    needs: [changes, seaweedfs]
    if: |
      always() &&
      needs.changes.outputs.tempo == 'true' &&
      needs.seaweedfs.result != 'failure'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: tempo, smoke_script: smoke-tempo.sh }

  loki:
    needs: [changes, seaweedfs]
    if: |
      always() &&
      needs.changes.outputs.loki == 'true' &&
      needs.seaweedfs.result != 'failure'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: loki, smoke_script: smoke-loki.sh }

  # ----- Layer 2: need postgres + seaweedfs -------------------------------

  mlflow:
    needs: [changes, postgres, seaweedfs]
    if: |
      always() &&
      needs.changes.outputs.mlflow == 'true' &&
      needs.postgres.result != 'failure' &&
      needs.seaweedfs.result != 'failure'
    uses: ./.github/workflows/_deploy-chart.yaml
    with: { chart: mlflow, smoke_script: smoke-mlflow.sh }

  # ----- Layer 3: need postgres + redis + presidio + otel-collector -------

  litellm:
    needs: [changes, postgres, redis, presidio, otel-collector]
    if: |
      always() &&
      needs.changes.outputs.litellm == 'true' &&
      needs.postgres.result != 'failure' &&
      needs.redis.result != 'failure' &&
      needs.presidio.result != 'failure' &&
      needs['otel-collector'].result != 'failure'
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: litellm
      smoke_script: smoke-litellm.sh
      mock_litellm: true

  # ----- Layer 4: full-stack e2e (needs everything not to have failed) ----

  e2e:
    needs:
      - changes
      - sealed-secrets
      - seaweedfs
      - redis
      - postgres
      - falkordb
      - keycloak
      - presidio
      - obot
      - prometheus
      - grafana
      - otel-collector
      - tempo
      - loki
      - mlflow
      - litellm
    if: |
      always() &&
      needs.changes.outputs.e2e == 'true' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: enterprise-platform
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.0
      - uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: enterprise-platform
      - name: ./deploy.sh --up (full stack, mock litellm)
        env:
          LITELLM_USE_MOCK_MODELS: "1"
        run: ./deploy.sh --up
      - run: kubectl -n "$NAMESPACE" get pods,svc
      - name: Smoke
        run: bash .github/scripts/smoke-stack-e2e.sh
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods | tail -300
          for rel in $(helm -n "$NAMESPACE" list -q 2>/dev/null); do
            echo "=== $rel ==="
            kubectl -n "$NAMESPACE" logs -l "app.kubernetes.io/instance=$rel" --all-containers --tail=100 || true
          done

      # No fail-fast abort: e2e failing turns the run red via the `gate` job
      # below, without cancelling sibling chart jobs.

  # ----- Merge gate: the single required check for branch protection ------
  # Runs unconditionally (always()) so it ALWAYS reports a status, even
  # when every chart job skipped. Red iff any job actually failed or was
  # cancelled; skipped/success both pass. Mark THIS job required on main —
  # never the individual chart jobs, which skip via the `changes` filter
  # and would otherwise leave a required check pending forever.
  gate:
    needs:
      - changes
      - sealed-secrets
      - seaweedfs
      - redis
      - postgres
      - falkordb
      - keycloak
      - presidio
      - obot
      - prometheus
      - grafana
      - otel-collector
      - tempo
      - loki
      - mlflow
      - litellm
      - e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "upstream results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*)
              echo "::error::a required job failed or was cancelled"; exit 1 ;;
            *)
              echo "all jobs succeeded or were skipped" ;;
          esac
