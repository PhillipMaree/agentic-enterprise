name: deploy-presidio
run-name: deploy-presidio

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/presidio/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-presidio.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-presidio.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/presidio/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-presidio.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-presidio.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: presidio
      smoke_script: smoke-presidio.sh
