name: deploy-platform-e2e

# Full-stack chain test. Brings up every service, sends a single chat
# completion through LiteLLM (with mock_response so we don't hit a real
# provider), and verifies the resulting telemetry made it through the
# OTel Collector to Tempo (trace), Loki (log), and Prometheus (metric).
#
# This is the gate that catches cross-chart regressions — e.g. "I changed
# the OTel exporter endpoint and now nothing reaches Tempo". Slower than
# the per-chart workflows (~10–15 min) so it's gated broadly: any helm
# chart change triggers it.

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-platform-e2e.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-platform-e2e.yaml"

permissions:
  contents: read

jobs:
  e2e:
    name: full-stack chain test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # GitHub-hosted runners have ~14GB free; the full stack pulls
          # quite a lot of images. Clear some headroom.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm dependency update (all charts with subcharts)
        run: |
          for c in seaweedfs tempo loki prometheus grafana otel-collector mlflow litellm; do
            helm dependency update "deploy/helm/$c"
          done

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install shared infrastructure
        run: |
          helm install platform-seaweedfs deploy/helm/seaweedfs -n "$NAMESPACE" --wait --timeout 5m
          helm install platform-redis     deploy/helm/redis     -n "$NAMESPACE" --wait --timeout 5m
          helm install platform-postgres  deploy/helm/postgres  -n "$NAMESPACE" --wait --timeout 5m

      - name: Bootstrap buckets + litellm database
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/platform-seaweedfs-all-in-one 8333:8333 >/tmp/pf-s3.log 2>&1 &
          PF=$!
          for i in $(seq 1 30); do curl -fsS http://localhost:8333/ >/dev/null 2>&1 && break; sleep 1; done
          pip install --quiet awscli
          AWS_ACCESS_KEY_ID=any AWS_SECRET_ACCESS_KEY=any AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:8333 s3 mb \
              s3://tempo-traces s3://loki-logs s3://mlflow-artifacts s3://prometheus-blocks
          kill $PF 2>/dev/null || true

          kubectl -n "$NAMESPACE" exec deploy/platform-postgres -- \
            psql -U postgres -c "CREATE DATABASE litellm"

      - name: Install telemetry backends
        run: |
          helm install platform-tempo      deploy/helm/tempo      -n "$NAMESPACE" --wait --timeout 5m
          helm install platform-loki       deploy/helm/loki       -n "$NAMESPACE" --wait --timeout 8m
          helm install platform-prometheus deploy/helm/prometheus -n "$NAMESPACE" --wait --timeout 8m

      - name: Install OTel Collector
        run: |
          helm install platform-otel-collector deploy/helm/otel-collector \
            -n "$NAMESPACE" --wait --timeout 5m

      - name: Install Grafana + MLflow
        run: |
          helm install platform-grafana deploy/helm/grafana -n "$NAMESPACE" --wait --timeout 8m
          helm install platform-mlflow  deploy/helm/mlflow  -n "$NAMESPACE" --wait --timeout 8m

      - name: Install data plane (presidio + mcp-gateway)
        run: |
          helm install platform-presidio    deploy/helm/presidio    -n "$NAMESPACE" --wait --timeout 5m
          helm install platform-mcp-gateway deploy/helm/mcp-gateway -n "$NAMESPACE" --wait --timeout 5m

      - name: Create LiteLLM secret + install with mock_response
        run: |
          kubectl -n "$NAMESPACE" create secret generic platform-litellm-secrets \
            --from-literal=masterkey="$(openssl rand -hex 32)" \
            --from-literal=anthropic-api-key="ci-fake" \
            --from-literal=openai-api-key="ci-fake"

          cat > /tmp/ci-values.yaml <<'EOF'
          litellm-helm:
            proxy_config:
              model_list:
                - model_name: mock-model
                  litellm_params:
                    model: anthropic/claude-3-haiku
                    mock_response: "hello from e2e"
          EOF
          helm install platform-litellm deploy/helm/litellm \
            --namespace "$NAMESPACE" \
            --values /tmp/ci-values.yaml \
            --wait --timeout 10m

      - name: Snapshot cluster state
        run: kubectl -n "$NAMESPACE" get pods,svc

      - name: Drive a request through the stack
        run: |
          set -euo pipefail
          MASTER_KEY="$(kubectl -n "$NAMESPACE" get secret platform-litellm-secrets -o jsonpath='{.data.masterkey}' | base64 -d)"

          kubectl -n "$NAMESPACE" port-forward svc/platform-litellm 4000:4000 >/tmp/pf-l.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/health/readiness >/dev/null 2>&1 && break
            sleep 2
          done

          # Tag the request so we can find the resulting trace.
          REQ_ID="e2e-$(date +%s)"
          for i in 1 2 3; do
            curl -fsS http://localhost:4000/v1/chat/completions \
              -H "Authorization: Bearer ${MASTER_KEY}" \
              -H "X-Request-Id: ${REQ_ID}-${i}" \
              -H 'Content-Type: application/json' \
              -d '{"model":"mock-model","messages":[{"role":"user","content":"hi"}]}' \
              | tee /tmp/resp-${i}.json
            grep -q 'hello from e2e' /tmp/resp-${i}.json
          done
          echo "${REQ_ID}" > /tmp/req_id

      - name: Verify trace reached Tempo
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/platform-tempo 3200:3200 >/tmp/pf-t.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3200/ready >/dev/null 2>&1 && break; sleep 1; done

          # Tempo search API — look for any span tagged with service.name=litellm.
          for i in $(seq 1 30); do
            RESP="$(curl -fsS 'http://localhost:3200/api/search?tags=service.name%3Dlitellm&limit=5')"
            echo "$RESP" | grep -q '"traceID"' && echo "trace from litellm reached Tempo" && exit 0
            sleep 3
          done
          echo "no litellm spans in Tempo"
          curl -fsS 'http://localhost:3200/api/search?tags=service.name%3Dlitellm&limit=5' || true
          exit 1

      - name: Verify metrics reached Prometheus
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/platform-prometheus-server 9090:80 >/tmp/pf-p.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1 && break; sleep 1; done

          # LiteLLM exposes Prometheus metrics on /metrics; prometheus
          # scrape config (in our values.yaml) targets `platform-litellm:4000`.
          # Any litellm_* series proves the scrape works.
          for i in $(seq 1 30); do
            RESP="$(curl -fsS 'http://localhost:9090/api/v1/query?query=%7B__name__%3D~%22litellm_.%2B%22%7D')"
            echo "$RESP" | grep -q '"result":\[{' && echo "litellm metrics in Prometheus" && exit 0
            sleep 3
          done
          echo "no litellm_* metrics in Prometheus"
          exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods | tail -200
          for c in litellm otel-collector tempo loki prometheus grafana mlflow presidio mcp-gateway seaweedfs postgres redis; do
            echo "=== $c ==="
            kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance=platform-$c --all-containers --tail=100 || true
          done
