name: deploy-platform-e2e
run-name: deploy-platform-e2e

# Full-stack chain test. Gated on any helm chart or deploy.sh change.
# Brings up the entire platform with one `./deploy.sh --up` and exercises
# the cross-chart wiring.

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-platform-e2e.yaml"
      - ".github/scripts/smoke-platform-e2e.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-platform-e2e.yaml"
      - ".github/scripts/smoke-platform-e2e.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: ./deploy.sh --up (full stack, mock litellm)
        env:
          LITELLM_USE_MOCK_MODELS: "1"
        run: ./deploy.sh --up

      - name: Cluster state snapshot
        run: kubectl -n "$NAMESPACE" get pods,svc

      - name: Smoke
        run: bash .github/scripts/smoke-platform-e2e.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods | tail -300
          for rel in $(helm -n "$NAMESPACE" list -q 2>/dev/null); do
            echo "=== $rel ==="
            kubectl -n "$NAMESPACE" logs -l "app.kubernetes.io/instance=$rel" --all-containers --tail=100 || true
          done
