name: auto-merge

# Enable auto-merge on PRs into main so they merge automatically once every
# required status check (branch protection on main) is green. Uses the repo's
# GITHUB_TOKEN — no personal-access-token scope needed.
#
# Prerequisites (already configured on this repo):
#   - Settings → General → "Allow auto-merge" enabled.
#   - main has branch protection with required status checks (otherwise
#     auto-merge has nothing to wait for and merges immediately).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --merge \
            "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
