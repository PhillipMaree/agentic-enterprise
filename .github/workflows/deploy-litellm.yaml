name: deploy-litellm
run-name: deploy-litellm

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/litellm/**"
      - "deploy/helm/postgres/**"
      - "deploy/helm/redis/**"
      - "deploy/helm/presidio/**"
      - "deploy/helm/otel-collector/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-litellm.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-litellm.sh"
      - ".github/scripts/_common.sh"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/litellm/**"
      - "deploy/helm/postgres/**"
      - "deploy/helm/redis/**"
      - "deploy/helm/presidio/**"
      - "deploy/helm/otel-collector/**"
      - "deploy/kind/kind-config.yaml"
      - "deploy.sh"
      - ".github/workflows/deploy-litellm.yaml"
      - ".github/workflows/_deploy-chart.yaml"
      - ".github/scripts/smoke-litellm.sh"
      - ".github/scripts/_common.sh"

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-chart.yaml
    with:
      chart: litellm
      smoke_script: smoke-litellm.sh
      mock_litellm: true
