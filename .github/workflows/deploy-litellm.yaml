name: deploy-litellm

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/litellm/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-litellm.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/litellm/**"
      - "deploy/kind/kind-config.yaml"
      - ".github/workflows/deploy-litellm.yaml"

permissions:
  contents: read

jobs:
  deploy:
    name: helm install on ephemeral kind
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: agentic-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm dependency update
        run: |
          for c in otel-collector litellm; do
            helm dependency update "deploy/helm/$c"
          done

      - name: helm lint litellm
        run: helm lint deploy/helm/litellm

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: agentic-platform

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install dependencies (postgres + redis + presidio + otel-collector)
        run: |
          helm install platform-postgres       deploy/helm/postgres       -n "$NAMESPACE" --wait --timeout 5m
          helm install platform-redis          deploy/helm/redis          -n "$NAMESPACE" --wait --timeout 5m
          helm install platform-presidio       deploy/helm/presidio       -n "$NAMESPACE" --wait --timeout 5m
          helm install platform-otel-collector deploy/helm/otel-collector -n "$NAMESPACE" --wait --timeout 5m

      - name: Bootstrap litellm database
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" exec deploy/platform-postgres -- \
            psql -U postgres -c "CREATE DATABASE litellm"

      - name: Create LiteLLM secret (mock-only — no upstream provider keys)
        run: |
          # `mock_response` makes LiteLLM return canned text without calling
          # the real provider, so we deliberately do NOT inject real keys.
          kubectl -n "$NAMESPACE" create secret generic platform-litellm-secrets \
            --from-literal=masterkey="$(openssl rand -hex 32)" \
            --from-literal=anthropic-api-key="ci-fake" \
            --from-literal=openai-api-key="ci-fake"

      - name: Override model list to use mock_response for CI
        run: |
          # Append a values override that swaps the live providers for a
          # mock_response model so the CI run never hits a real API.
          cat > /tmp/ci-values.yaml <<'EOF'
          litellm-helm:
            proxy_config:
              model_list:
                - model_name: mock-model
                  litellm_params:
                    model: anthropic/claude-3-haiku
                    mock_response: "hello from ci"
          EOF

      - name: Install platform-litellm
        run: |
          helm install platform-litellm deploy/helm/litellm \
            --namespace "$NAMESPACE" \
            --values /tmp/ci-values.yaml \
            --wait --timeout 10m
          kubectl -n "$NAMESPACE" get pods,svc

      - name: Integration test — chat completion via the proxy
        run: |
          set -euo pipefail
          MASTER_KEY="$(kubectl -n "$NAMESPACE" get secret platform-litellm-secrets -o jsonpath='{.data.masterkey}' | base64 -d)"

          kubectl -n "$NAMESPACE" port-forward svc/platform-litellm 4000:4000 >/tmp/pf-l.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/health/readiness >/dev/null 2>&1 && break
            sleep 2
          done

          RESP="$(curl -fsS http://localhost:4000/v1/chat/completions \
            -H "Authorization: Bearer ${MASTER_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-model","messages":[{"role":"user","content":"hi"}]}')"
          echo "$RESP"
          echo "$RESP" | grep -q 'hello from ci'

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          for c in litellm postgres redis presidio otel-collector; do
            echo "=== $c ==="
            kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance=platform-$c --all-containers --tail=200 || true
          done
